{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "a2a-inspector.fullname" . }}
  labels:
    {{- include "a2a-inspector.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # One rule for everything: the backend serves the UI, /static and the
          # Socket.IO endpoint from the same origin. Traefik upgrades the
          # WebSocket on /socket.io/ without extra configuration, and its
          # entrypoints already run a 600s readTimeout, which matches the
          # 600s httpx timeout the app uses for streaming agent responses.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "a2a-inspector.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
{{- end }}
